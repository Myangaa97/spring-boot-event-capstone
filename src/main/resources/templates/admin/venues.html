<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Venues - Admin | KiloE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
    <div class="admin-layout">

        <div th:replace="~{admin/fragments :: sidebar('venues')}"></div>

        <div class="main-content">
            <header class="admin-topbar" style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
                <h1>Manage Venues</h1>
                <button onclick="showForm()" class="btn btn-primary btn-sm" style="padding: 10px 18px;">
                    <i class="svg-icon fa-solid fa-plus"></i>
                    New Venue
                </button>
            </header>

            <div class="admin-content">
                <!-- INLINE FORM -->
                <div id="formSection" class="hidden" style="margin-bottom: 24px;">
                    <div class="panel">
                        <div class="table-toolbar">
                            <h2 class="panel-title" style="margin-bottom: 0;" id="formTitle">New Venue</h2>
                            <button onclick="hideForm()" class="btn btn-secondary btn-sm">
                                <i class="svg-icon fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <form id="venueForm" class="form-grid-2">
                            <input type="hidden" id="editId" value="">
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label class="form-label">Venue Name</label>
                                <input type="text" id="fName" required maxlength="150" class="form-control" placeholder="e.g. UB Palace">
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label class="form-label">Address</label>
                                <input type="text" id="fAddress" required maxlength="255" class="form-control" placeholder="Full address">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Capacity</label>
                                <input type="number" id="fCapacity" required min="1" class="form-control" placeholder="3000">
                            </div>
                            <div style="display: flex; gap: 12px; align-items: flex-end; grid-column: 1 / -1;">
                                <button type="submit" class="btn btn-primary">Save Venue</button>
                                <button type="button" onclick="hideForm()" class="btn btn-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Table -->
                <div class="panel" style="padding: 0; overflow: hidden;">
                    <div class="table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Address</th>
                                    <th>Capacity</th>
                                    <th style="text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="venuesTableBody"></tbody>
                        </table>
                    </div>
                    <div id="emptyTable" class="empty-state hidden"><h3>No venues found</h3></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin-venues.js}" src="../../static/js/admin-venues.js"></script>
</body>
</html>
