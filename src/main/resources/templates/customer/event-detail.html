<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - KiloE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-inner">
                <a th:href="@{/}" href="/" class="brand">
                    <div class="brand-logo">
                        <i class="svg-icon fa-solid fa-ticket"></i>
                    </div>
                    <span class="brand-name">Kilo<span>E</span></span>
                </a>
                <div class="nav-links">
                    <a th:href="@{/}" href="/" class="nav-link">Home</a>
                    <a th:href="@{/customer/events}" href="events.html" class="nav-link active">Events</a>
                </div>
                <div class="nav-actions">
                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn btn-secondary">Sign In</a>
                        <a th:href="@{/register}" class="btn btn-primary">Sign Up</a>
                    </th:block>
                    <th:block sec:authorize="isAuthenticated()">
                        <span sec:authentication="name" style="font-size: 14px; color: var(--text-muted, #64748b);">user@example.com</span>
                        <a th:href="@{/customer/dashboard}" class="btn btn-outline">Dashboard</a>
                        <a th:href="@{/logout}" class="btn btn-secondary">Sign Out</a>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main>
        <div class="container section" style="padding-top: 32px; max-width: 1024px;">
            <a th:href="@{/customer/events}" href="events.html" class="back-link">
                <i class="svg-icon fa-solid fa-arrow-left"></i>
                Back to Events
            </a>

            <div class="panel" style="padding: 0; overflow: hidden;" id="eventContainer">
                <!-- JS-рээр дүүргэнэ -->
            </div>
        </div>
    </main>

    <!-- BOOKING MODAL -->
    <div id="bookingModal"></div>

    <th:block sec:authorize="isAuthenticated()">
        <script>window.IS_LOGGED_IN = true;</script>
    </th:block>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 KiloE. All rights reserved.</p></div>
        </div>
    </footer>

    <script th:src="@{/js/customer-event-detail.js}" src="../../static/js/customer-event-detail.js"></script>
</body>
</html>
