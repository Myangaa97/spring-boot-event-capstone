<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Kiloe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">

            <div class="auth-brand">
                <a href="/" class="brand" style="justify-content: center;">
                    <div class="brand-logo">
						<i class="svg-icon fa-solid fa-calendar-days"></i>
                    </div>
                    <span class="brand-name">Kilo<span>E</span></span>
                </a>
                <p>Sign in with your registered account</p>
            </div>

            <div class="auth-card">
                <form th:action="@{/login}" method="post" id="loginForm">
                	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div th:if="${param.error}" class="alert alert-error">
                        Invalid email or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        You have been signed out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success">
                        Registration successful! Please sign in.
                    </div>

                    <div class="form-group">
                        <label for="username" class="form-label">Email</label>
                        <div class="input-icon">
                        	<i class="svg-icon fa-solid fa-envelope"></i>
                            <input type="email" name="username" id="username" required class="form-control" placeholder="you@example.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-icon input-icon-right">
                        	<i class="svg-icon fa-solid fa-lock"></i>
                            <input type="password" name="password" id="password" required class="form-control" placeholder="••••••••">
                            <button type="button" onclick="togglePassword()" class="input-eye">
                            	<i id="eyeIcon" class="svg-icon fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div style="margin-bottom: 24px;">
                        <label class="checkbox-row">
                            <input type="checkbox" name="remember">
                            <span>Remember me</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
                </form>

                <div class="auth-switch">
                    <p>Don't have an account
                        <a th:href="@{/register}" href="register.html">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
	    function togglePassword() {
	        const input = document.getElementById('password');
	        const icon = document.getElementById('eyeIcon');
	        if(input.type === 'password') {
	            input.type = 'text';
				icon.classList.remove('fa-eye');
				icon.classList.add('fa-eye-slash');
	        } else {
	            input.type = 'password';
				icon.classList.remove('fa-eye-slash');
				icon.classList.add('fa-eye');
	        }
	    }
	</script>
</body>
</html>
