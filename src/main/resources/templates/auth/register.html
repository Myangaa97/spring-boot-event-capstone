<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KiloE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <!-- Logo -->
            <div class="auth-brand">
                <a href="/" class="brand" style="justify-content: center;">
                    <div class="brand-logo">
                        <i class="svg-icon fa-solid fa-calendar-days"></i>
                    </div>
                    <span class="brand-name">Kilo<span>E</span></span>
                </a>
                <p>Create a new user account</p>
            </div>

            <!-- Register Form -->
            <div class="auth-card">
                <form th:action="@{/register}" method="post" id="registerForm">
                    <div th:if="${error}" class="alert alert-error" th:text="${error}">Error</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" name="firstName" required maxlength="50"
                                   class="form-control" placeholder="First Name"
                                   th:value="${registerRequest?.firstName}">
                        </div>
                        <div class="form-group">
                            <label for="lastName" class="form-label">Name</label>
                            <input type="text" id="lastName" name="lastName" required maxlength="50"
                                   class="form-control" placeholder="Name"
                                   th:value="${registerRequest?.lastName}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-icon">
                            <i class="svg-icon fa-solid fa-envelope"></i>
                            <input type="email" id="email" name="email" required
                                   class="form-control" placeholder="you@example.com"
                                   th:value="${registerRequest?.email}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-icon input-icon-right">
                            <i class="svg-icon fa-solid fa-lock"></i>
                            <input type="password" id="password" name="password" required minlength="6"
                                   class="form-control" placeholder="Minimum 6 characters">
                            <button type="button" onclick="togglePassword()" class="input-eye">
                                <i id="eyeIcon" class="svg-icon fa-solid fa-eye"></i>
                            </button>
                        </div>
                        <p id="passwordHint" class="form-hint hidden">Minimum 6 characters required</p>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-icon">
                            <i class="svg-icon fa-solid fa-shield-halved"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" required
                                   class="form-control" placeholder="Confirm your password">
                        </div>
                        <p id="matchHint" class="form-hint hidden"></p>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        Sign Up
                    </button>
                </form>

                <div class="auth-switch">
                    <p>Already have an account?
                        <a th:href="@{/login}" href="login.html">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Password match validation
        const password = document.getElementById('password');
        const confirm = document.getElementById('confirmPassword');
        const matchHint = document.getElementById('matchHint');

        confirm.addEventListener('input', () => {
            if (confirm.value === '') {
                matchHint.classList.add('hidden');
            } else if (confirm.value === password.value) {
                matchHint.textContent = 'Passwords match';
                matchHint.className = 'form-hint ok';
            } else {
                matchHint.textContent = 'Passwords do not match';
                matchHint.className = 'form-hint bad';
            }
        });
    </script>
</body>
</html>
